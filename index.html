<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь сходок</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Календарь сходок</h1>

    <div id="userBlock" class="card">
        <span id="username"></span>
        <button id="changeNameBtn">Сменить имя</button>
    </div>

    <div class="month-nav">
        <button id="prevMonth">◀</button>
        <h2 id="monthTitle"></h2>
        <button id="nextMonth">▶</button>
    </div>

    <div class="weekdays">
        <div>Пн</div>
        <div>Вт</div>
        <div>Ср</div>
        <div>Чт</div>
        <div>Пт</div>
        <div>Сб</div>
        <div>Вс</div>
    </div>

    <div id="calendar" class="calendar"></div>

    <div class="legend">
        <div>
            <span class="dot free"></span>
            Свободен
        </div>
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
